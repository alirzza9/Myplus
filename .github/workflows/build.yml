name: Build Full Native PlusGuard APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-native-telegram:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Free Disk Space (Required for Telegram C++ NDK build)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          df -h

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Clone Official Telegram Android Source (with submodules)
        run: |
          git clone --depth 1 --recursive https://github.com/Telegram-FOSS-Team/Telegram-FOSS.git telegram-src

      - name: Inject Anti-Screenshot, Anti-Record & Plus Style Patches
        working-directory: telegram-src
        run: |
          python3 - << 'EOF'
          import os, glob, re

          print("🔍 Applying Stealth Screenshot & Plus Patches...")

          # 1. Remove FLAG_SECURE everywhere (Allows screenshot & screen recording in Secret Chats & Private Channels)
          for root, _, files in os.walk("TMessagesProj"):
              for file in files:
                  if file.endswith(".java"):
                      path = os.path.join(root, file)
                      with open(path, "r", encoding="utf-8", errors="ignore") as f:
                          content = f.read()

                      modified = False

                      # Strip WindowManager.LayoutParams.FLAG_SECURE
                      if "FLAG_SECURE" in content:
                          content = content.replace("WindowManager.LayoutParams.FLAG_SECURE", "0")
                          modified = True

                      # 2. Block Screenshot Notification in SecretChatHelper.java
                      if file == "SecretChatHelper.java" and "sendScreenshotNotification(" in content:
                          content = re.sub(
                              r'(public\s+void\s+sendScreenshotNotification\s*\([^)]*\)\s*\{)',
                              r'\1 if (true) return;',
                              content
                          )
                          modified = True
                          print("✅ Patched SecretChatHelper: Screenshot notification blocked!")

                      # 3. Block Screenshot Notification in ChatActivity.java (TTL / Disappearing media)
                      if file == "ChatActivity.java" and "sendScreenshotNotification" in content:
                          content = content.replace("SendMessagesHelper.getInstance(currentAccount).sendScreenshotNotification", "//blocked")
                          modified = True
                          print("✅ Patched ChatActivity: Media screenshot notification blocked!")

                      # 4. Bypass Channel Copy/Save/Forward Restrictions (noforwards)
                      if file == "MessagesController.java" and "isChatNoForwards(" in content:
                          content = re.sub(
                              r'(public\s+boolean\s+isChatNoForwards\s*\([^)]*\)\s*\{)',
                              r'\1 if (true) return false;',
                              content
                          )
                          modified = True
                          print("✅ Patched MessagesController: Channel save/forward restrictions removed!")

                      # 5. Apply Plus Messenger Classic Green Color (#008069) as Default Theme Color
                      if file == "Theme.java":
                          content = content.replace("0xff527da3", "0xff008069")
                          content = content.replace("0xff5085b1", "0xff008069")
                          modified = True
                          print("✅ Patched Theme.java: Plus Messenger Green applied!")

                      if modified:
                          with open(path, "w", encoding="utf-8") as f:
                              f.write(content)

          EOF

      - name: Configure Dummy Signing Key & API Keys
        working-directory: telegram-src
        run: |
          # Generate a release keystore so APK installs cleanly on any phone
          keytool -genkey -v -keystore TMessagesProj/config/release.keystore \
            -alias release -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=PlusGuard, OU=Dev, O=PlusGuard, L=Tehran, S=TH, C=IR"

          cat << 'EOF' >> gradle.properties
          APP_ID=6
          APP_HASH=eb06d4abfb49dc3eeb1aeb98ae0f581e
          RELEASE_KEY_PASSWORD=android
          RELEASE_KEY_ALIAS=release
          RELEASE_STORE_PASSWORD=android
          org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m
          EOF

      - name: Install Required Android NDK & CMake
        run: |
          yes | sudo $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;21.4.7075529" "cmake;3.18.1" "platforms;android-34" "build-tools;34.0.0"

      - name: Compile Full Telegram APK (Takes ~25-40 mins)
        working-directory: telegram-src
        run: |
          chmod +x gradlew
          ./gradlew assembleafatDebug --no-daemon --stacktrace

      - name: Upload Compiled PlusGuard APK
        uses: actions/upload-artifact@v4
        with:
          name: PlusGuard-Full-Telegram-APK
          path: telegram-src/TMessagesProj/build/outputs/apk/afat/debug/*.apk
